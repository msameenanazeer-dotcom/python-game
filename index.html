<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guessing Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-card">
    <h1>🎯 Number Guessing Game</h1>
    <p class="subtitle">Guess a number between 1 and 100</p>

    <input id="guessInput" type="number" min="1" max="100" placeholder="Enter your guess">
    <button id="guessBtn">Guess</button>

    <p id="message">I have chosen a number. Can you guess it?</p>
    <p>Attempts: <strong id="attempts">0</strong></p>

    <button id="restartBtn" class="restart">🔄 Play Again</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
